[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-agent-lite"
version = "0.1.0"
description = "Lightweight remote Codex workspace hosted on a small server"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.12",
  "uvicorn>=0.32.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
remote-agent-lite = "remote_agent_lite.cli:main"
remote-agent-info = "remote_agent_lite.server_info:main"

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["remote_agent_lite"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]

